name: build-dosbox-psp

# Builds EBOOT.PBP in the cloud using the pspdev toolchain, following the
# steps in README.md exactly. No copyrighted game data lives in this repo --
# just the open-source (GPL-2.0) DOSBox PSP port itself.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Build inside the pspdev toolchain
        run: |
          docker run --rm --user root -v "$PWD":/src -w /src pspdev/pspdev:latest bash -c '
            set -e
            apk add --no-cache autoconf automake libtool binutils
            export PSPDEV=/usr/local/pspdev
            export PATH=$PSPDEV/bin:$PATH
            ./autogen.sh
            SDL_CONFIG="$PSPDEV/bin/sdl-config" \
            CXXFLAGS="-I$PSPDEV/psp/sdk/include -I$PSPDEV/psp/include/SDL -O2 -G0" \
            LDFLAGS="-L$PSPDEV/psp/sdk/lib -L$PSPDEV/psp/lib -lc -lpspuser -lpspkernel" \
            CFLAGS="-I$PSPDEV/psp/sdk/include" \
            ./configure --host=psp
            cp config.bak.h config.h
            make -j$(nproc) || true
            cd src
            psp-gcc -L$PSPDEV/psp/sdk/lib -o dosbox \
              -Wl,--start-group \
              dosbox.o p_sprint.o ftruncate.o \
              cpu/libcpu.a debug/libdebug.a dos/libdos.a fpu/libfpu.a hardware/libhardware.a \
              gui/libgui.a ints/libints.a misc/libmisc.a shell/libshell.a \
              hardware/serialport/libserial.a \
              -lm -lpspdebug -lpspgu -lpspctrl -lpspdisplay -lpspge \
              -lpspsdk -lpsprtc -lpspaudio -lstdc++ -lpspirkeyb -lc -lpspnet -lpspnet_inet \
              -lpsppower -lpsputility -lpspuser -lpspkernel \
              -Wl,--end-group \
              -specs=$PSPDEV/psp/sdk/lib/prxspecs -Wl,-T$PSPDEV/psp/sdk/lib/linkfile.prx,-q
            psp-fixup-imports dosbox
            psp-prxgen dosbox dosbox.prx
            mksfoex -d MEMSIZE=1 "DOSBox PSP" PARAM.SFO
            pack-pbp EBOOT.PBP PARAM.SFO ICON0.PNG NULL NULL PIC1.PNG NULL dosbox.prx NULL
          '

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: DOSBox-PSP-EBOOT
          path: src/EBOOT.PBP
